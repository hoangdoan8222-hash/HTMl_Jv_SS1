<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let bookName = prompt("Nhập tên cuốn sách:");

      let originalName = bookName;
      let lowerCaseName = bookName.toLowerCase();
     let upperCaseName = bookName.toUpperCase();

     console.log("Tên gốc: " + originalName);
    console.log("Tên viết thường: " + lowerCaseName);
    console.log("Tên viết hoa: " + upperCaseName);

    </script>

</body>
</html>
